<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script type="module"
    src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
  </script>
</head>

<body style="margin:0;">

  <model-viewer
    src="miekka_ilmantaustaa.glb"
    ar
    ar-modes="scene-viewer"
    camera-controls
    style="width:100vw; height:100vh;">

    <!-- PAKOTETTU AR-NAPPI -->
    <button slot="ar-button"
      style="
        position:absolute;
        bottom:20px;
        left:50%;
        transform:translateX(-50%);
        padding:14px 20px;
        font-size:18px;
        background:#000;
        color:#fff;
        border:none;
        border-radius:8px;">
      Käynnistä AR
    </button>

  </model-viewer>

</body>
</html>
